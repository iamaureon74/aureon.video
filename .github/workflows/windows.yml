name: windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: engine
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: ffmpeg (gpl build with libx264 + libass; github-hosted, gyan.dev fallback)
        run: |
          $urls = @(
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip",
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          )
          $ok = $false
          foreach ($u in $urls) {
            for ($i = 1; $i -le 3 -and -not $ok; $i++) {
              try { Invoke-WebRequest $u -OutFile ffmpeg.zip -ErrorAction Stop; $ok = $true }
              catch { Write-Host "download failed ($u, try $i): $_"; Start-Sleep -Seconds (5 * $i) }
            }
            if ($ok) { break }
          }
          if (-not $ok) { throw "could not download ffmpeg" }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $bin = (Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          echo "FFBIN=$bin" >> $env:GITHUB_ENV
          echo "$bin" >> $env:GITHUB_PATH

      - name: install
        run: |
          python -m pip install --upgrade pip
          # regular (non-editable) install so pyinstaller can see the package
          pip install ".[test]" pyinstaller

      - name: unit tests
        run: python -m pytest -q

      - name: package
        run: |
          pyinstaller --noconfirm --onedir --name aureon `
            --paths . --collect-submodules aureon `
            --collect-data aureon --collect-data faster_whisper `
            --collect-binaries ctranslate2 `
            packaging/aureon_entry.py
          Copy-Item "$env:FFBIN\ffmpeg.exe","$env:FFBIN\ffprobe.exe" dist/aureon/
          Copy-Item ../README.md dist/aureon/README.md
          Copy-Item packaging/START-HERE.txt dist/aureon/START-HERE.txt

      - name: smoke test the packaged exe (strip + audio, no model download)
        run: |
          python packaging/smoke_fixture.py "$env:RUNNER_TEMP\smoke.mov"
          ./dist/aureon/aureon.exe scan "$env:RUNNER_TEMP\smoke.mov"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./dist/aureon/aureon.exe clean "$env:RUNNER_TEMP\smoke.mov" -o "$env:RUNNER_TEMP\out" --no-overlay
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: zip
        run: Compress-Archive -Path dist/aureon -DestinationPath dist/aureon-windows-x64.zip

      - uses: actions/upload-artifact@v5
        with:
          name: aureon-windows-x64
          path: engine/dist/aureon-windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: aureon-windows-x64
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" aureon-windows-x64.zip \
            --repo "$GITHUB_REPOSITORY" --title "aureon $TAG (windows)" \
            --notes "windows x64, portable. unzip, open the aureon folder, double-click aureon.exe. the transcription model (~800 mb) downloads on first use. not code-signed yet: windows smartscreen will warn — choose 'more info' → 'run anyway'."
