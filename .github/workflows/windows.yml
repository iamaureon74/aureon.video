name: windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ffmpeg (gyan.dev essentials, includes libass)
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $bin = (Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          echo "FFBIN=$bin" >> $env:GITHUB_ENV
          echo "$bin" >> $env:GITHUB_PATH

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" pyinstaller

      - name: unit tests
        run: python -m pytest -q

      - name: package
        run: |
          pyinstaller --noconfirm --onedir --name aureon `
            --collect-data aureon --collect-data faster_whisper `
            --collect-binaries ctranslate2 --icon NONE `
            packaging/aureon_entry.py
          Copy-Item "$env:FFBIN\ffmpeg.exe","$env:FFBIN\ffprobe.exe" dist/aureon/

      - name: smoke test the packaged exe (strip + audio, no model download)
        run: |
          python packaging/smoke_fixture.py "$env:RUNNER_TEMP\smoke.mov"
          ./dist/aureon/aureon.exe scan "$env:RUNNER_TEMP\smoke.mov"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./dist/aureon/aureon.exe clean "$env:RUNNER_TEMP\smoke.mov" -o "$env:RUNNER_TEMP\out" --no-overlay
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: aureon-windows-x64
          path: engine/dist/aureon
