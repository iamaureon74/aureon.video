[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aureon"
version = "0.1.0"
description = "strip metadata, hidden audio signals and fingerprints from video; add a synced transcript"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pillow>=10",
  "faster-whisper>=1.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
aureon = "aureon.cli:main"

[tool.setuptools]
packages = ["aureon"]

[tool.setuptools.package-data]
aureon = ["fonts/*", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end tests that run ffmpeg and whisper"]
